<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="palazzoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE0D2" />
      <stop offset="50%" stop-color="#E1D3C1" />
      <stop offset="100%" stop-color="#C5B49E" />
    </linearGradient>
    <filter id="pantShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#pantShadow)">
    <!-- Cintura alta con trabillas finas -->
    <path d="M160 50 Q250 65 340 50 L345 100 Q250 115 155 100 Z" fill="#D2C3B0" stroke="#B8A690" stroke-width="2" />
    <line x1="190" y1="55" x2="190" y2="95" stroke="#9E8B75" stroke-width="3" />
    <line x1="250" y1="58" x2="250" y2="98" stroke="#9E8B75" stroke-width="3" />
    <line x1="310" y1="55" x2="310" y2="95" stroke="#9E8B75" stroke-width="3" />

    <!-- Pernera Izquierda de pernera ancha Palazzo -->
    <path d="M155 100 Q190 200 240 240 L195 670 Q145 660 90 660 Q120 380 155 100 Z" fill="url(#palazzoGrad)" stroke="#C5B49E" stroke-width="1.5" />

    <!-- Pernera Derecha de pernera ancha Palazzo -->
    <path d="M345 100 Q310 200 260 240 L305 670 Q355 660 410 660 Q380 380 345 100 Z" fill="url(#palazzoGrad)" stroke="#C5B49E" stroke-width="1.5" />

    <!-- Pinzas delanteras y caída fluida -->
    <line x1="195" y1="100" x2="160" y2="660" stroke="rgba(0,0,0,0.08)" stroke-width="4" />
    <line x1="305" y1="100" x2="340" y2="660" stroke="rgba(0,0,0,0.08)" stroke-width="4" />
  </g>
</svg>
