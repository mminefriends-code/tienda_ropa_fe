<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7BEB4" />
      <stop offset="50%" stop-color="#8DA399" />
      <stop offset="100%" stop-color="#738980" />
    </linearGradient>
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.2)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)" />
    </linearGradient>
    <filter id="fabricShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#fabricShadow)">
    <!-- Mangas -->
    <path d="M140 130 C100 160, 70 230, 85 300 C110 290, 130 260, 145 220 Z" fill="url(#sageGrad)" opacity="0.95" />
    <path d="M360 130 C400 160, 430 230, 415 300 C390 290, 370 260, 355 220 Z" fill="url(#sageGrad)" opacity="0.95" />

    <!-- Cuerpo / Pecho envolvente escote en V -->
    <path d="M160 110 Q250 85 340 110 Q370 140 360 220 Q330 290 320 330 Q250 340 180 330 Q170 290 140 220 Q130 140 160 110 Z" fill="url(#sageGrad)" />
    
    <!-- Escote en V cruzado -->
    <path d="M185 105 L275 270 Q250 280 225 270 L315 105" fill="none" stroke="#687C74" stroke-width="4" stroke-linecap="round" />
    <path d="M185 105 L260 240 L315 105 Q250 160 185 105 Z" fill="rgba(0,0,0,0.06)" />

    <!-- Lazo y cinturón ajustable -->
    <path d="M175 320 Q250 335 325 320 Q325 345 250 348 Q175 345 175 320 Z" fill="#6E857C" />
    <circle cx="280" cy="335" r="9" fill="#5F746C" />
    <path d="M280 335 Q295 380 270 420 Q285 410 290 340 Z" fill="#5F746C" />
    <path d="M280 335 Q320 370 340 430 Q330 390 290 338 Z" fill="#5F746C" />

    <!-- Falda Midi fluida -->
    <path d="M175 335 Q130 500 110 680 Q180 710 250 705 Q320 710 390 680 Q370 500 325 335 Q250 350 175 335 Z" fill="url(#sageGrad)" />

    <!-- Pliegues de la falda -->
    <path d="M210 340 Q180 520 170 690" stroke="rgba(0,0,0,0.12)" stroke-width="6" fill="none" />
    <path d="M250 345 Q250 530 250 705" stroke="rgba(255,255,255,0.18)" stroke-width="5" fill="none" />
    <path d="M290 340 Q320 520 330 690" stroke="rgba(0,0,0,0.15)" stroke-width="6" fill="none" />
    
    <!-- Estampado floral minimalista -->
    <g fill="#F3E9E9" opacity="0.65">
      <circle cx="200" cy="220" r="6" />
      <circle cx="210" cy="215" r="5" />
      <circle cx="205" cy="228" r="5" />
      
      <circle cx="300" cy="200" r="6" />
      <circle cx="310" cy="195" r="5" />
      
      <circle cx="160" cy="450" r="8" />
      <circle cx="172" cy="445" r="7" />
      
      <circle cx="260" cy="500" r="8" />
      <circle cx="270" cy="492" r="7" />
      
      <circle cx="330" cy="560" r="9" />
      <circle cx="342" cy="552" r="7" />
      
      <circle cx="220" cy="620" r="8" />
      <circle cx="230" cy="612" r="7" />
    </g>
  </g>
</svg>
